[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Local Agent session hub and model gateway for Codex and Claude Code"
authors = [
    {name = "BeWaterMyFriend7"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/agent_hub"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
